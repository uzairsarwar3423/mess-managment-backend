# Continuous integration. Runs on pull requests and on pushes to any branch except main
# (main is covered by deploy.yml, which calls this workflow before building and deploying).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci fails if package-lock.json is out of sync with package.json and verifies every
      # tarball against the lockfile's integrity hash.
      - name: Install dependencies (lockfile-exact)
        run: npm ci --ignore-scripts

      - name: Verify registry signatures of installed packages
        run: npm audit signatures

      - name: Typecheck (strict tsc, the project's lint gate)
        run: npm run typecheck

      - name: Unit + integration tests
        run: npx vitest run --exclude "tests/db/**"

      # PGlite (real Postgres in WASM) is memory hungry; run those files one at a time.
      - name: Database tests (real migrations on PGlite)
        run: npx vitest run tests/db --no-file-parallelism

      - name: Build
        run: npm run build

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: npm audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

  infra-lint:
    name: Lint Dockerfile, shell scripts, compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --ignore DL3018 - < Dockerfile
      - name: shellcheck
        run: shellcheck -x deploy/*.sh deploy/vps/*.sh
      - name: compose config
        run: |
          touch deploy/.env.production .env
          API_IMAGE=example/image:tag docker compose -f deploy/docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.yml config --quiet

  migrations:
    name: Migration runner on real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runner inputs
        run: |
          mkdir -p "$RUNNER_TEMP/m"
          cp -r database/migrations "$RUNNER_TEMP/m/migrations"
          cp deploy/migrate.sh "$RUNNER_TEMP/m/"
          printf 'PGHOST=127.0.0.1\nPGUSER=postgres\nPGPASSWORD=ci-only-password\nPGDATABASE=postgres\n' > "$RUNNER_TEMP/m/migrate.env"
      - name: Supabase stand-in (roles + auth schema)
        run: docker run --rm -i --network host -e PGPASSWORD=ci-only-password postgres:17-alpine psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 < database/ci/supabase_prelude.sql
      - name: Apply all migrations, then re-run (must be a no-op)
        env:
          MIGRATE_DOCKER_NETWORK: host
        run: |
          bash "$RUNNER_TEMP/m/migrate.sh" up
          bash "$RUNNER_TEMP/m/migrate.sh" up 2>&1 | tee out.txt
          grep -q "done: 0 migration(s) applied" out.txt
          bash "$RUNNER_TEMP/m/migrate.sh" status

  docker:
    name: Docker image build + validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: mess-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate image (non-root, no secrets, boots, health, graceful stop)
        run: bash deploy/ci/validate-image.sh mess-api:ci
      - name: Vulnerability scan (Trivy, fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mess-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
