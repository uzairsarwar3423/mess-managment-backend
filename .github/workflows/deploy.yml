# Push to `main` -> test -> build the image -> send it to the VPS -> start it. Nothing else to do by hand.
# One-time setup (3 GitHub secrets, a few server commands): see DEPLOY.md
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you press "Run workflow" on the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install, typecheck, test
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npx vitest run --exclude "tests/db/**"
          npx vitest run tests/db --no-file-parallelism

      - name: Build the Docker image
        run: docker build --target runtime --build-arg GIT_SHA=${{ github.sha }} -t mess-api:${{ github.sha }} .

      - name: Connect to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          port="${VPS_PORT:-22}"
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  BatchMode yes\n' "$VPS_HOST" "$VPS_USER" "$port" > ~/.ssh/config

      - name: Send the image and the server files
        run: |
          scp deploy/docker-compose.yml deploy/release.sh vps:/opt/mess-backend/
          docker save mess-api:${{ github.sha }} | gzip | ssh vps 'gunzip | docker load'

      - name: Start the new version (rolls back by itself if it is not healthy)
        run: ssh vps 'chmod +x /opt/mess-backend/release.sh && /opt/mess-backend/release.sh mess-api:${{ github.sha }}'
