# Manual rollback from the GitHub UI: Actions > Rollback > Run workflow.
# Leave "image_tag" empty to go back to the previous image, or give a commit SHA that was deployed before.
# Uses the same secrets/variables as deploy.yml. Database migrations are NOT reverted.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA (image tag) to roll back to. Empty = previous image."
        required: false
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/mess-backend' }}
      SSH_PORT: ${{ vars.VPS_PORT || '22' }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Validate input
        run: |
          if [ -n "$IMAGE_TAG" ] && ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "image_tag must be a commit SHA"; exit 1
          fi

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Roll back
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target=""
          [ -n "$IMAGE_TAG" ] && target="ghcr.io/${GITHUB_REPOSITORY,,}:$IMAGE_TAG"
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          set +e
          ssh vps "'$DEPLOY_PATH/rollback.sh' $target"
          status=$?
          ssh vps "docker logout ghcr.io >/dev/null" || true
          exit $status

      - name: Public health check
        if: vars.PRODUCTION_URL != ''
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "${{ vars.PRODUCTION_URL }}/health/ready"
