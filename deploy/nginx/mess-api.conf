# Nginx site for the Mess API (host Nginx, not a container).
#   sudo cp mess-api.conf /etc/nginx/sites-available/mess-api.conf
#   sudo ln -s /etc/nginx/sites-available/mess-api.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mess.rapto.cloud          # adds the 443 server block + auto-renewal
#
# The API listens on 127.0.0.1:8080 only. Set TRUST_PROXY_HOPS=2 (Cloudflare + Nginx) in .env.production so rate limits
# and logs see the real client IP from X-Forwarded-For.

limit_req_zone $binary_remote_addr zone=mess_api:10m rate=20r/s;

upstream mess_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mess.rapto.cloud;

    # JSON bodies are capped at 100kb by the app; uploads go straight to Cloudinary, not through here.
    client_max_body_size 1m;

    access_log /var/log/nginx/mess-api.access.log;
    error_log  /var/log/nginx/mess-api.error.log warn;

    location / {
        limit_req zone=mess_api burst=40 nodelay;

        proxy_pass http://mess_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;   # PDF reports can take a few seconds
        proxy_send_timeout 60s;
    }

    # Uptime monitors poll this; keep it out of the access log noise.
    location = /health {
        access_log off;
        proxy_pass http://mess_api;
    }
}
