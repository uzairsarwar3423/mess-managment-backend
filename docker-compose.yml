# Local development in Docker (hot reload).  Production: deploy/docker-compose.prod.yml
#
#   copy .env.example .env      # fill in your DEV Supabase/Cloudinary values
#   docker compose up --build   # http://localhost:8080/health
#
# The database is Supabase (hosted), so there is no Postgres/Redis container: the API talks to
# your dev Supabase project exactly as `npm run dev` does.

name: mess-dev

services:
  api:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: development
      # Polling makes file watching work on Windows/macOS bind mounts.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
